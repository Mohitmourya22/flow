<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polar Energy Management System</title>
<style>
/* ---------- theme variables ---------- */
:root{
  --bg:#eef1fb;--bg2:#dfe6fa;--ink:#141a3a;--muted:#4a5278;--glass:rgba(255,255,255,.55);--glass-b:rgba(80,90,180,.25);--grid:rgba(60,70,150,.07);
  --flow:#4f46e5;--flow-glow:rgba(79,70,229,.55);--particle:#fff;
  --stage1-bg:#C9C9FF;--stage1-border:#7b7bf0;--stage1-ink:#0d1b6b;
  --stage2-bg:#E0C5F5;--stage2-border:#8a2be2;--stage2-ink:#4b0a91;
  --stage3-bg:#FFE5C2;--stage3-border:#e07b1a;--stage3-ink:#a24500;
  --stage4-bg:#D9F7C5;--stage4-border:#2e9e4a;--stage4-ink:#0a5a1a;
  --stage5-bg:#FFFCCF;--stage5-border:#c9b800;--stage5-ink:#5c5600;
}
:root[data-theme="dark"]{
  --bg:#0b0f1f;--bg2:#141a35;--ink:#f1f3ff;--muted:#b5bbe0;--glass:rgba(20,26,54,.6);--glass-b:rgba(150,160,255,.3);--grid:rgba(150,160,255,.07);
  --flow:#7c8bff;--flow-glow:rgba(124,139,255,.7);
  --stage1-border:#9a9aff;--stage2-border:#b25cff;--stage3-border:#ff9a3d;--stage4-border:#4fd071;--stage5-border:#e6d500;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(900px 500px at 15% 0%,var(--bg2),transparent 70%),radial-gradient(900px 600px at 90% 100%,var(--bg2),transparent 70%),var(--bg);
  background-attachment:fixed;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
/* ---------- header ---------- */
header{position:relative;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:14px clamp(14px,3vw,40px)}
.title h1{margin:0;font-size:clamp(20px,2vw,30px);font-weight:900;letter-spacing:-.01em}
.title p{margin:2px 0 0;font-size:clamp(13px,1vw,16px);color:var(--muted);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip,.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);font:700 14px inherit;font-family:inherit;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.chip{cursor:default}
.live{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.sw{width:38px;height:22px;border-radius:999px;background:#9aa0c8;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.btn[aria-pressed="true"] .sw{background:#4f46e5}
.btn[aria-pressed="true"] .sw::after{left:19px}
.btn:hover{border-color:var(--flow)}
:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}
/* ---------- architecture ---------- */
main{padding:0 clamp(6px,1.5vw,28px) 30px}
.architecture{max-width:1500px;margin:0 auto;border-radius:24px;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(30,30,100,.18),inset 0 1px 0 rgba(255,255,255,.45);overflow-x:auto;padding:clamp(6px,1vw,16px)}
svg{display:block;width:100%;min-width:820px;height:auto;font-family:inherit}
/* stages */
.stage rect.frame{stroke-width:2.5;filter:drop-shadow(0 10px 22px rgba(30,30,100,.22))}
.stage .sheen{fill:url(#sheen);pointer-events:none}
.stage text.st{font-size:21px;font-weight:900;text-anchor:middle}
.s1 .frame{fill:var(--stage1-bg);stroke:var(--stage1-border)} .s1 .st{fill:var(--stage1-ink)}
.s2 .frame{fill:var(--stage2-bg);stroke:var(--stage2-border)} .s2 .st{fill:var(--stage2-ink)}
.s3 .frame{fill:var(--stage3-bg);stroke:var(--stage3-border)} .s3 .st{fill:var(--stage3-ink)}
.s4 .frame{fill:var(--stage4-bg);stroke:var(--stage4-border)} .s4 .st{fill:var(--stage4-ink)}
.s5 .frame{fill:var(--stage5-bg);stroke:var(--stage5-border)} .s5 .st{fill:var(--stage5-ink)}
/* nodes */
.node{cursor:pointer;outline:none}
.node .body{stroke-width:2.5;transition:transform .2s,filter .2s;transform-box:fill-box;transform-origin:center}
.node text{font-weight:800;text-anchor:middle;pointer-events:none}
.node .l1{font-size:20px} .node .l2{font-size:17.5px;font-weight:700}
.node:hover .body,.node:focus-visible .body,.node.hot .body{transform:translateY(-3px);filter:drop-shadow(0 10px 14px rgba(20,20,80,.35)) drop-shadow(0 0 8px var(--glow,#88f))}
.n1 .body{fill:#CCE5FF;stroke:#8c8cf5;--glow:#8c8cf5} .n1 text{fill:#0d2a7a}
.n2 .body{fill:#fff;stroke:#a24df0;--glow:#a24df0} .n2 text{fill:#8a2be2}
.n2d .body{fill:url(#gd2);stroke:#7a12d0;stroke-width:3.5} .n2d text{fill:#1c0836;font-size:21px}
.n3 .body{fill:#F5CCC0;stroke:#d9701a;--glow:#ff9a3d} .n3 text{fill:#a24500}
.n3d .body{fill:url(#gd3);stroke:#d9701a;stroke-width:3.5} .n3d text{fill:#8b0000;font-size:21px}
.n3f .body{fill:#FFCCCC;stroke:#e5646e;--glow:#ff6b6b} .n3f text{fill:#b3141f}
.n4 .body{fill:#fff;stroke:#1f8a3c;--glow:#4fd071} .n4 text{fill:#0a6a1a}
.aux{fill:#8FC4A0;stroke:#2e7d4a;stroke-width:2.5} .auxt{fill:#053d14;font-size:19px;font-weight:800;text-anchor:middle}
.n5 .body{fill:#fff;stroke:#c9b800;--glow:#e6d500} .n5 text{fill:#5c5600}
.met{fill:#FFFB8F;stroke:#c9b800;stroke-width:2.5} .mett{fill:#5c5600;font-size:19px;font-weight:800;text-anchor:middle}
.dia .body{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 14px var(--glow,#a24df0))}}
.n2d{--glow:#a24df0}.n3d{--glow:#ff9a3d}
/* labels */
.pill rect{fill:#fff;stroke-width:2}
.pill text{font-size:17px;font-weight:800;text-anchor:middle;fill:#141a3a}
/* edges */
.edge .base{fill:none;stroke:var(--flow);stroke-width:3;opacity:.55;transition:.2s}
.edge .dash{fill:none;stroke:var(--flow);stroke-width:3.5;stroke-dasharray:3 15;stroke-linecap:round;animation:dash 1s linear infinite;filter:drop-shadow(0 0 4px var(--flow-glow))}
.edge .dot{fill:var(--particle);stroke:var(--flow);stroke-width:2;filter:drop-shadow(0 0 6px var(--flow-glow))}
.edge.hot .base{opacity:1;stroke-width:5}
@keyframes dash{to{stroke-dashoffset:-18}}
.off .dash{animation:none;opacity:0}.off .dot{display:none}
@media (prefers-reduced-motion:reduce){.dash,.dia .body,.live{animation:none!important}}
@media (max-width:820px){svg{min-width:900px}.title p{display:none}}
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>Polar Energy Management System</h1>
    <p>End-to-End Intelligent Dispatch, Safety &amp; SCADA Architecture</p>
  </div>
  <div class="controls">
    <span class="chip"><span class="live"></span>Interactive Architecture</span>
    <button class="btn" id="flowBtn" aria-pressed="true" aria-label="Flow Animation on or off"><span>Flow Animation</span><span class="sw"></span></button>
    <button class="btn" id="themeBtn" aria-label="Switch between light and dark mode"><span id="themeLbl">Dark</span></button>
  </div>
</header>
<main>
<section class="architecture" aria-label="System architecture flowchart">
<svg id="fc" viewBox="0 0 1400 2350" role="img" aria-label="Five-stage flowchart: Polar Telemetry and Forecast, Dispatch Engine, Safety Interlock, Energy Dispatch, SCADA and Audit Reporting">
<defs>
  <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto-start-reverse"><path d="M1 1L11 6L1 11z" fill="#4f46e5"/></marker>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="gd2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9b4ff"/><stop offset="1" stop-color="#b56cf7"/></linearGradient>
  <linearGradient id="gd3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbdcd3"/><stop offset="1" stop-color="#efb8a8"/></linearGradient>
</defs>
<g id="stages"></g>
<g id="edges"></g>
<g id="titles"></g>
<g id="nodes"></g>
</svg>
</section>
</main>
<script>
(function(){
const NS="http://www.w3.org/2000/svg";const svg0=document.getElementById("fc");
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
 
/* ---------- data: stages ---------- */
const stages=[
 {c:"s1",x:390,y:20,w:620,h:445,t:"STAGE 1: 🛰️ Polar Telemetry & Multi-Modal Forecast"},
 {c:"s2",x:390,y:500,w:620,h:610,t:"STAGE 2: ⚡ Multi-Timeframe Dispatch Engine"},
 {c:"s3",x:390,y:1150,w:620,h:620,t:"STAGE 3: 🛡️ Safety Interlock & Fallback Matrix"},
 {c:"s4",x:720,y:1830,w:660,h:500,t:"STAGE 4: ⚙️ Multi-Subsystem Energy Dispatch"},
 {c:"s5",x:20,y:1830,w:660,h:500,t:"STAGE 5: 📊 Real-Time SCADA & Audit Reporting"}
];
/* ---------- data: nodes ---------- */
const N=(id,c,x,y,w,h,lines,dia)=>({id,c,x,y,w,h,lines,dia});
const nodes=[
 N("raw","n1",450,80,500,90,["🛰️ Raw Weather & SCADA Telemetry","(Temp, Wind, Solar, Battery SOC)"]),
 N("norm","n1",450,215,500,90,["🔄 Data Normalization & Feature Prep","(StandardScaler Pipeline)"]),
 N("gbr","n1",450,350,500,90,["🤖 Gradient Boosting Regressor","(P10 | P50 | P90 Quantile Forecast)"]),
 N("milp","n2",450,565,500,90,["🧠 MILP Unit-Commitment Engine","(HiGHS Branch-and-Cut)"]),
 N("feas","n2d dia",0,0,0,0,["❓ MILP Feasible?"],[700,800,200,110]),
 N("lp","n2",450,980,500,90,["📉 Continuous LP Optimizer","(Scipy Dual Relaxation)"]),
 N("safe","n3",450,1215,500,90,["🔒 Safety Validator Interlock","(C-Rate Limits, SOC Floor, Tier-1 Protect)"]),
 N("pass","n3d dia",0,0,0,0,["❓ Safety Passed?"],[700,1450,200,110]),
 N("fb","n3f",450,1640,500,90,["🚨 Deterministic Fallback Controller","(Priority Load Shedding & Dump Load)"]),
 N("disp","n4",830,1900,440,90,["✅ Validated Dispatch Execution","(LFP Battery + Supercap + Diesel)"]),
 N("chp","n4",765,2160,280,100,["🔥 Thermal CHP","& Snow-Melter"]),
 N("h2","n4",1055,2160,280,100,["🔋 Hydrogen Fuel-Cell","& Electrolyzer"]),
 N("dash","n5",130,1900,480,90,["🖥️ Interactive Streamlit SCADA Dashboard"]),
 N("audit","n5",50,2160,290,100,["📄 Automated System","Audit & Report Pipeline"]),
 N("fuel","n5",360,2160,290,100,["🌱 Live Fuel Savings","& CO2 Telemetry"])
];
/* ---------- data: edges (a -> b) ---------- */
const edges=[
 ["raw","norm","M700 170V215"],["norm","gbr","M700 305V350"],["gbr","milp","M700 440V565"],
 ["milp","feas","M700 655V690"],
 ["feas","safe","M900 800H1100V1260H950"],       /* YES */
 ["feas","lp","M700 910V980"],                    /* NO  */
 ["lp","safe","M700 1070V1215"],
 ["safe","pass","M700 1305V1340"],
 ["pass","disp","M900 1450H1330V1945H1270"],      /* SAFE */
 ["pass","fb","M700 1560V1640"],                  /* UNSAFE */
 ["fb","disp","M700 1730V1925H830"],
 ["disp","dash","M830 1970H610"],
 ["disp","chp","M845 1990V2160"],
 ["disp","h2","M1255 1990V2160"],
 ["dash","audit","M160 1990V2160"],
 ["dash","fuel","M540 1990V2160"]
];
/* ---------- data: containers & pills ---------- */
const boxes=[
 {c:"aux",x:750,y:2100,w:600,h:200,t:"🔄 Auxiliary Subsystem Routing",tc:"auxt",cx:1050},
 {c:"met",x:40,y:2100,w:620,h:200,t:"📈 Dashboard Metrics & Export",tc:"mett",cx:350}
];
const pills=[
 {t:"✔️ Yes",x:1182,y:1000,w:130,col:"#2e9e4a"},
 {t:"❌ No (Solver Fail)",x:555,y:945,w:230,col:"#d6336c"},
 {t:"⚠️ Violated / Unsafe",x:550,y:1600,w:250,col:"#e07b1a"}
];
 
/* ---------- render ---------- */
const gS=document.getElementById("stages"),gE=document.getElementById("edges"),gN=document.getElementById("nodes");
const gT=document.getElementById("titles"),defs=svg0.querySelector("defs"),plates=[];
stages.forEach((s,i)=>{const g=el("g",{class:"stage "+s.c},gS);
 el("rect",{class:"frame",x:s.x,y:s.y,width:s.w,height:s.h,rx:22},g);
 el("rect",{class:"sheen",x:s.x,y:s.y,width:s.w,height:s.h,rx:22},g);
 const tg=el("g",{class:"stage "+s.c},gT),cp=el("clipPath",{id:"cp"+i},defs),pr=el("rect",{},cp);
 const pl=el("rect",{style:"fill:var(--stage"+s.c.slice(1)+"-bg)"},tg);
 el("rect",{class:"sheen",x:s.x,y:s.y,width:s.w,height:s.h,rx:22,"clip-path":"url(#cp"+i+")"},tg);
 const tx=el("text",{class:"st",x:s.x+s.w/2,y:s.y+38},tg);tx.textContent=s.t;plates.push([tx,pl,pr,s]);});
function fit(){plates.forEach(([tx,pl,pr,s])=>{const b=tx.getBBox();[pl,pr].forEach(q=>{q.setAttribute("rx",8);q.setAttribute("x",b.x-14);q.setAttribute("y",s.y+12);q.setAttribute("width",b.width+28);q.setAttribute("height",34)})})}
fit();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
boxes.forEach(b=>{const g=el("g",{},gS);
 el("rect",{class:b.c,x:b.x,y:b.y,width:b.w,height:b.h,rx:12},g);
 el("text",{class:b.tc,x:b.cx,y:b.y+34},g).textContent=b.t;});
 
const edgeEls=[];
edges.forEach((e,i)=>{const g=el("g",{class:"edge","data-a":e[0],"data-b":e[1]},gE);
 el("path",{id:"p"+i,class:"base",d:e[2],"marker-end":"url(#ah)"},g);
 el("path",{class:"dash",d:e[2]},g);
 const dot=el("circle",{class:"dot",r:5},g);
 const am=el("animateMotion",{dur:(2.4+(i%4)*.3)+"s",repeatCount:"indefinite",begin:(i%5)*.35+"s"},dot);
 el("mpath",{href:"#p"+i},am);
 edgeEls.push(g);});
 
nodes.forEach(n=>{
 const g=el("g",{class:"node "+n.c,id:"n-"+n.id,tabindex:0,"data-id":n.id,role:"img","aria-label":n.lines.join(" ")},gN);
 let cx,cy;
 if(n.dia){const[x,y,hw,hh]=n.dia;cx=x;cy=y;
  el("polygon",{class:"body",points:`${x},${y-hh} ${x+hw},${y} ${x},${y+hh} ${x-hw},${y}`},g);}
 else{cx=n.x+n.w/2;cy=n.y+n.h/2;el("rect",{class:"body",x:n.x,y:n.y,width:n.w,height:n.h,rx:6},g);}
 const L=n.lines,two=L.length>1;
 L.forEach((ln,k)=>{const t=el("text",{class:k?"l2":"l1",x:cx,y:cy+(two?(k?17:-9):7)},g);t.textContent=ln;});
 const on=v=>{edgeEls.forEach(e=>{if(e.dataset.a===n.id||e.dataset.b===n.id)e.classList.toggle("hot",v)})};
 g.addEventListener("mouseenter",()=>on(true));g.addEventListener("mouseleave",()=>on(false));
 g.addEventListener("focus",()=>on(true));g.addEventListener("blur",()=>on(false));
});
pills.forEach(p=>{const g=el("g",{class:"pill"},gN);
 el("rect",{x:p.x-p.w/2,y:p.y-16,width:p.w,height:32,rx:16,stroke:p.col},g);
 el("text",{x:p.x,y:p.y+6},g).textContent=p.t;});
 
/* ---------- flow animation toggle ---------- */
const svg=document.getElementById("fc"),fb=document.getElementById("flowBtn");
const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
function setFlow(on){fb.setAttribute("aria-pressed",on);svg.classList.toggle("off",!on);
 try{on?svg.unpauseAnimations():svg.pauseAnimations()}catch(e){}}
fb.addEventListener("click",()=>setFlow(fb.getAttribute("aria-pressed")!=="true"));
setFlow(!rm);
 
/* ---------- theme ---------- */
const root=document.documentElement,tb=document.getElementById("themeBtn"),tl=document.getElementById("themeLbl");
let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
function setTheme(t){root.dataset.theme=t;tl.textContent=t==="dark"?"Light":"Dark";}
setTheme(saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
tb.addEventListener("click",()=>{const t=root.dataset.theme==="dark"?"light":"dark";setTheme(t);try{localStorage.setItem("theme",t)}catch(e){}});
})();
</script>
</body>
</html>
